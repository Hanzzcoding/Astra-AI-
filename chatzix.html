<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChatZix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
[hidden]{display:none!important}
/* Layout: one phone-width column. Top bar, scrolling list, bottom tab bar. Chats, channels, settings pages and sheets slide over it. */
:root{
  --bg:#f4f7f5; --surface:#ffffff; --fg:#0f1f19; --muted:#5b6d65; --line:#e1e8e4;
  --accent:#0e9f6e; --accent-ink:#ffffff; --accent-soft:#dff4ea;
  --out:#d5f3e3; --in:#ffffff; --wall:#e8eee9;
  --danger:#d23f3f; --read:#2a9be0; --c3:#d9962b;
  --shadow:0 8px 28px rgba(10,30,20,.20);
  --f-display:'Outfit',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1512; --surface:#131f1a; --fg:#e6efe9; --muted:#8fa49a; --line:#223029;
    --accent:#2fcf93; --accent-ink:#052016; --accent-soft:#17382b;
    --out:#12503a; --in:#1a2a23; --wall:#0a110e;
    --danger:#ef6b6b; --read:#53b8f2; --c3:#f0b94c; --shadow:0 8px 28px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1512; --surface:#131f1a; --fg:#e6efe9; --muted:#8fa49a; --line:#223029;
  --accent:#2fcf93; --accent-ink:#052016; --accent-soft:#17382b;
  --out:#12503a; --in:#1a2a23; --wall:#0a110e;
  --danger:#ef6b6b; --read:#53b8f2; --c3:#f0b94c; --shadow:0 8px 28px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-body);-webkit-text-size-adjust:100%}
button,input,textarea{font-family:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;max-width:560px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
@media(min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
#screen{height:100%;display:flex;flex-direction:column;min-height:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.vf{width:16px;height:16px;flex:none}
.pv svg.i,.meta svg.i{width:16px;height:16px}
svg.mt{width:15px!important;height:15px!important;color:var(--muted)}
.hbtn{display:flex;align-items:center;gap:10px;flex:1;min-width:0;border:0;background:none;color:inherit;text-align:left;padding:0;cursor:pointer;font:inherit}
.avb{display:inline-flex;flex:none;border-radius:50%;cursor:pointer}
.row.cr{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.cbar{display:flex;gap:10px;justify-content:center;padding-bottom:4px}
.cbar button{flex:1;max-width:110px;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:14px;padding:10px 6px;font:600 13px var(--f-body);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--line);cursor:pointer}
.blk{display:flex;align-items:center;gap:12px;padding-block:12px;background:var(--surface);border-top:1px solid var(--line);flex:none}
.svbody video{max-width:100%;max-height:100%;min-height:0;border-radius:8px}
video.prev{display:block;max-width:100%;max-height:42vh;margin:0 auto;border-radius:12px;background:#000}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:13.5px;color:var(--muted)}
a.lnk{color:var(--read);text-decoration:underline;overflow-wrap:anywhere;word-break:break-word}
a.pill{text-decoration:none;display:inline-block}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;min-height:56px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.bar h1{font:600 24px var(--f-display);color:var(--accent);margin:0;flex:1;letter-spacing:-.01em;min-width:0}
.bar .ttl{font:600 18px var(--f-display);flex:1;min-width:0}
.ib{width:40px;height:40px;border:0;background:none;color:var(--fg);border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--accent-soft)}
.ib.w{color:#fff}.ib.w:hover{background:rgba(255,255,255,.15)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sbar{padding-block:8px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}

/* Mading: video lebar di bawah bar judul dan pencarian, tanpa warna hitam */
.mading{position:relative;overflow:hidden;flex:none;aspect-ratio:16/8;background:var(--accent-soft);border-bottom:1px solid var(--line)}
.mading>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mading .mcap{position:absolute;left:14px;bottom:10px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.mcap{display:block;font:600 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.clk{font:600 16px var(--f-display);background:var(--accent-soft);color:var(--accent);padding:7px 16px;border-radius:16px;flex:none}

/* lists */
.main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.list{flex:1;min-height:0;overflow-y:auto;padding-bottom:88px}
.row{display:flex;align-items:center;gap:14px;padding-block:10px;width:100%;border:0;background:none;text-align:left;color:inherit;font:inherit;cursor:pointer}
.row:hover{background:var(--accent-soft)}
.row.plain{cursor:default}.row.plain:hover{background:none}
.rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rt{display:flex;gap:8px;align-items:center;justify-content:space-between;min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;min-width:0}
.tm{font-size:12px;color:var(--muted);flex:none}
.tm.on{color:var(--accent);font-weight:600}
.pv{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;min-width:0}
.pv.wrap{white-space:normal}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 12px/20px var(--f-body);text-align:center;flex:none}
.badge.mute{background:var(--muted);color:var(--surface)}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 18px var(--f-display);flex:none;letter-spacing:.02em;background-size:cover;background-position:center;background-repeat:no-repeat}
.av.sm{width:38px;height:38px;font-size:15px}
.av.lg{width:96px;height:96px;font-size:34px}
.sic{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.sic.s{width:40px;height:40px}
.sec{font:600 12px var(--f-body);color:var(--muted);padding-block:16px 6px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.chips{display:flex;gap:8px;padding-block:10px;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 14px;border-radius:18px;font:600 13px var(--f-body);cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:16px;padding:5px 14px;font:600 13px var(--f-body);cursor:pointer;flex:none}
.pill.on{background:var(--accent-soft)}
.pill.d{border-color:var(--danger);color:var(--danger)}
.pill[disabled]{opacity:.4;cursor:default}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.ring{padding:3px;border-radius:50%;border:2.5px solid var(--accent);position:relative;flex:none}
.ring.seen{border-color:var(--line)}
.ring.none{border-color:transparent}
.ring .av{width:44px;height:44px;font-size:17px}
.plus{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:2px solid var(--bg);display:grid;place-items:center}
.plus svg.i{width:12px;height:12px;stroke-width:3}
.miss{color:var(--danger)}

/* fab + nav */
.fab{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer}
.nav{display:flex;background:var(--surface);border-top:1px solid var(--line);flex:none}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;border:0;background:none;color:var(--muted);font:600 11px var(--f-body);cursor:pointer}
.nav .ic{width:58px;height:30px;border-radius:15px;display:grid;place-items:center;position:relative}
.nav button[aria-current=true]{color:var(--fg)}
.nav button[aria-current=true] .ic{background:var(--accent-soft);color:var(--accent)}
.nav .nb{position:absolute;top:-4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:700 11px/18px var(--f-body);text-align:center}

/* overlays + thread */
.overlay{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:10;animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(22px);opacity:0}to{transform:none;opacity:1}}
.thread-msgs{flex:1;min-height:0;overflow-y:auto;background:var(--wall);padding-block:12px;display:flex;flex-direction:column;gap:4px}
.msg{max-width:80%;padding:7px 10px 5px;border-radius:12px;box-shadow:0 1px 1px rgba(0,0,0,.08);overflow-wrap:anywhere;font-size:15px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.msg.me{align-self:flex-end;background:var(--out);border-top-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--in);border-top-left-radius:4px}
.msg.hm{padding:4px 4px 5px;width:min(280px,80%)}
.msg .who{display:block;font:600 12.5px var(--f-body);margin-bottom:1px}
.msg.hm .who{padding:2px 6px 0}
.cap{padding:2px 6px 0}
.meta{float:right;margin:7px 0 -3px 12px;font-size:11px;color:var(--muted);display:inline-flex;gap:3px;align-items:center;white-space:nowrap}
.msg.hm .meta{margin-right:4px}
.read{color:var(--read)}
.day{align-self:center;background:var(--surface);color:var(--muted);font:600 12px var(--f-body);padding:4px 12px;border-radius:10px;margin:6px 0;text-align:center}
.sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mimg{display:block;width:100%;border-radius:9px;background:var(--line);object-fit:cover;cursor:pointer;margin-bottom:4px}
.doc{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.06);border-radius:9px;padding:8px 10px;margin-bottom:4px;cursor:pointer}
.quote{border-left:3px solid var(--accent);background:rgba(0,0,0,.06);border-radius:7px;padding:4px 8px;margin-bottom:4px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;min-width:0}
.quote b{font-size:12.5px;color:var(--accent)}
.quote span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gone{display:inline-flex;gap:6px;align-items:center;font-style:italic;color:var(--muted)}
.gone svg.i{width:16px;height:16px}
.rbar{display:flex;align-items:center;gap:8px;background:var(--wall);padding-top:8px;flex:none}
.rq{flex:1;min-width:0;border-left:3px solid var(--accent);background:var(--surface);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column}
.rq b{font-size:12.5px;color:var(--accent)}
.rq span{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp{display:flex;align-items:center;gap:8px;padding-block:8px;background:var(--wall);flex:none}
.comp .field{flex:1;min-width:0;display:flex;align-items:center;background:var(--surface);border-radius:24px;padding:0 8px 0 6px}
.comp .field.na{padding-left:14px}
.comp .field input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font-size:16px;padding:12px 4px;outline:none}
.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.note{padding-block:12px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;flex:none}
.note span{flex:1}

/* sheets, menu, toast */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);width:100%;border-radius:20px 20px 0 0;max-height:90%;overflow-y:auto;padding-block:8px 20px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet h2{font:600 19px var(--f-display);margin:0 0 12px}
.sb{display:flex;flex-direction:column;gap:12px}
.menu{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:54px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:6px;z-index:40;min-width:210px}
.menu button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;background:none;color:var(--fg);font:500 15px var(--f-body);border-radius:9px;cursor:pointer}
.menu button:hover{background:var(--accent-soft)}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:#16241e;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:80;max-width:86%;text-align:center;box-shadow:var(--shadow)}
.sms{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:12px 14px;z-index:70;animation:drop .25s ease-out;display:flex;gap:12px;align-items:flex-start}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.sms b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
.prev{display:block;max-width:100%;max-height:42vh;margin:0 auto;border-radius:12px;background:var(--line)}
.mrow{border:0;background:none;color:var(--fg);font:500 16px var(--f-body);display:flex;align-items:center;gap:14px;padding:12px 0;cursor:pointer;width:100%;text-align:left}
.mrow.d{color:var(--danger)}
.mrow svg.i{color:var(--muted)}.mrow.d svg.i{color:var(--danger)}

/* forms */
.inp{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font-size:16px;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:none;min-height:96px}
label.l{font-weight:600;font-size:14px;display:block;margin-bottom:6px}
.opt{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.req{color:var(--danger);margin-left:3px}
.btn{border:0;border-radius:26px;padding:14px 22px;font:600 16px var(--f-body);background:var(--accent);color:var(--accent-ink);cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost{background:none;color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default}
.sw{width:46px;height:27px;border-radius:14px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw[aria-checked=true]{background:var(--accent)}
.sw[aria-checked=true]::after{transform:translateX(19px)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatches button[aria-pressed=true]{border-color:var(--fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.camb{position:absolute;right:-2px;bottom:-2px;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:3px solid var(--bg);display:grid;place-items:center;cursor:pointer}
.camb svg.i{width:18px;height:18px}
.ppwrap{position:relative;width:96px;margin:0 auto}
.stbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.stbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.big{font:600 28px var(--f-display);letter-spacing:-.01em}

/* onboarding */
.onb{flex:1;min-height:0;overflow-y:auto;padding-block:28px 24px}
.onb>.in{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-bottom:6px}
.brand h1{font:700 32px var(--f-display);margin:0;letter-spacing:-.02em}
.brand p{margin:0;color:var(--muted)}
.logo{width:76px;height:76px}
.phone{display:flex;gap:8px}
.cc{display:grid;place-items:center;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600}
.hint{color:var(--muted);font-size:13px;margin:0}
.err{color:var(--danger);font-size:13px;margin:0}
.demo{background:var(--accent-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:13px;margin:0}
.otp{font:600 30px var(--f-display);letter-spacing:.45em;text-align:center;padding-left:.45em}
.qrbox{background:#fff;padding:10px;border-radius:16px;width:fit-content;max-width:100%;margin:4px auto;border:1px solid var(--line)}
.qrbox svg{display:block;max-width:100%;height:auto}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.splash .logo{width:96px;height:96px;animation:pop .5s ease-out}
.splash h1{font:700 36px var(--f-display);margin:0;letter-spacing:-.02em}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* status viewer, image viewer, call */
.sv{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;color:#fff}
.bars{display:flex;gap:4px;padding-top:12px}
.bars i{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.bars b{display:block;height:100%;width:0;background:#fff}
.bars b.full{width:100%}
.bars b.run{animation:fill 4s linear forwards}
@keyframes fill{to{width:100%}}
.svh{display:flex;align-items:center;gap:10px;padding-block:10px}
.svbody{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;cursor:pointer;padding-bottom:16px}
.svbody p{font:600 28px/1.3 var(--f-display);margin:0;overflow-wrap:anywhere;max-width:100%}
.svbody p.c{font:500 17px/1.4 var(--f-body)}
.svbody img{max-width:100%;max-height:100%;min-height:0;object-fit:contain;border-radius:8px}
.sv a.lnk{color:#fff}
.viewer{position:absolute;inset:0;z-index:52;background:#000;display:flex;flex-direction:column;color:#fff}
.vbody{flex:1;min-height:0;display:grid;place-items:center;padding:8px}
.vbody img{max-width:100%;max-height:100%;object-fit:contain}
.call{position:absolute;inset:0;z-index:55;background:#0d1f17;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding-block:64px 48px}
.call .mid{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.call h2{font:600 28px var(--f-display);margin:8px 0 0}
.call .st{color:#a8c4b6}
.call .acts{display:flex;gap:28px}
.call .cb{width:62px;height:62px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer}
.call .cb[aria-pressed=true]{background:#fff;color:#0d1f17}
.call .cb.end{background:#e54848}
.call .cb.end svg{transform:rotate(135deg)}

/* video opening (setelah daftar) */
.open{position:absolute;inset:0;z-index:90;background:#000;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;animation:fade .3s}
.open video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.open .ctl{position:relative;display:flex;gap:10px;align-items:center;padding-block:16px 28px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.open .ctl .btn{flex:1}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- database lokal (IndexedDB) untuk foto dan dokumen ---------- */
var DB=(function(){
  var db=null,ready=null,mem={};
  function open(){
    if(ready)return ready;
    ready=new Promise(function(res){
      try{
        var r=indexedDB.open('chatzix',1);
        r.onupgradeneeded=function(){r.result.createObjectStore('media')};
        r.onsuccess=function(){db=r.result;res(true)};
        r.onerror=function(){res(false)};
        r.onblocked=function(){res(false)};
      }catch(e){res(false)}
    });
    return ready;
  }
  function run(mode,fn){
    return open().then(function(ok){
      if(!ok||!db)return null;
      return new Promise(function(res){
        try{
          var t=db.transaction('media',mode),st=t.objectStore('media'),q=fn(st);
          t.oncomplete=function(){res(q&&q.result!==undefined?q.result:true)};
          t.onerror=function(){res(null)};t.onabort=function(){res(null)};
        }catch(e){res(null)}
      });
    });
  }
  return {
    open:open,
    persistent:function(){return !!db},
    put:function(id,blob){return run('readwrite',function(s){return s.put(blob,id)}).then(function(r){if(r===null)mem[id]=blob})},
    get:function(id){if(mem[id])return Promise.resolve(mem[id]);return run('readonly',function(s){return s.get(id)}).then(function(r){return r&&r!==true?r:null})},
    del:function(id){delete mem[id];return run('readwrite',function(s){return s.delete(id)})},
    clear:function(){mem={};return run('readwrite',function(s){return s.clear()})}
  };
})();
var URLS={};
function getUrl(id){
  if(URLS[id])return Promise.resolve(URLS[id]);
  return DB.get(id).then(function(b){if(!b)return null;URLS[id]=URL.createObjectURL(b);return URLS[id]});
}
function dropMedia(ids){
  ids.forEach(function(id){DB.del(id);delete S.media[id];S.cleaned[id]=1;if(URLS[id]){try{URL.revokeObjectURL(URLS[id])}catch(e){}delete URLS[id]}});
  S.myStatuses=S.myStatuses.filter(function(i){return !i.media||S.media[i.media.id]});
  save();
}
function purgeStatuses(){
  var cut=Date.now()-864e5,ids=[];
  S.myStatuses=S.myStatuses.filter(function(i){if(i.ts<cut){if(i.media)ids.push(i.media.id);return false}return true});
  if(ids.length)dropMedia(ids);
}

var IMG_TYPES=['image/jpeg','image/png','image/webp','image/gif'];

var DOC_RE=/\.(pdf|docx?|xlsx?|pptx?|txt|csv|zip)$/i;

  if(f.size>25e6)return Promise.reject(new Error('vsize'));

    var u=URL.createObjectURL(f),v=document.createElement('video');v.preload='metadata';v.muted=true;
    v.onloadedmetadata=function(){var d=v.duration,w=v.videoWidth,h=v.videoHeight;URL.revokeObjectURL(u);if(!isFinite(d)||!w){rej(new Error('type'));return}if(d>30.5){rej(new Error('dur'));return}res({w:w,h:h,dur:Math.ceil(d)})};

function shrink(file,max,q){
  return loadImg(file).then(function(o){
    var w=o.img.naturalWidth,h=o.img.naturalHeight,s=Math.min(1,max/Math.max(w,h)),cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(h*s));

    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(o.img,0,0,cw,ch);URL.revokeObjectURL(o.url);
    return new Promise(function(res,rej){c.toBlob(function(b){b?res({blob:b,w:cw,h:ch}):rej(new Error('enc'))},'image/jpeg',q)});

function qrSvg(text){
  var n,dark;
  try{var q=qrcode(0,'M');q.addData(text);q.make();n=q.getModuleCount();dark=function(r,c){return q.isDark(r,c)}}
  catch(e){n=25;var seed=hue(text)+7;var rnd=function(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};var g=[];for(var r=0;r<n;r++){g.push([]);for(var c=0;c<n;c++)g[r].push(rnd()>.5)}dark=function(r,c){return g[r][c]}}
  var d='';for(var r2=0;r2<n;r2++)for(var c2=0;c2<n;c2++)if(dark(r2,c2))d+='M'+c2+' '+r2+'h1v1h-1z';
  return '<svg viewBox="-2 -2 '+(n+4)+' '+(n+4)+'" width="208" height="208" shape-rendering="crispEdges" role="img" aria-label="Kode QR"><rect x="-2" y="-2" width="'+(n+4)+'" height="'+(n+4)+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}

var CFGKEY='chatzix-fbcfg';

function parseCfg(txt){
  var s=String(txt||''),a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a<0||b<=a)return null;
  var body=s.slice(a,b+1),o=null;
  try{o=JSON.parse(body)}catch(e){o={};var re=/([A-Za-z]\w*)\s*:\s*["']([^"']*)["']/g,m;while((m=re.exec(body)))o[m[1]]=m[2]}
  return o&&o.apiKey&&o.projectId&&o.appId?o:null;

function loadScript(src){return new Promise(function(res,rej){var el=document.createElement('script'),t=setTimeout(function(){rej(new Error('load'))},12000);el.src=src;el.onload=function(){clearTimeout(t);res()};el.onerror=function(){clearTimeout(t);rej(new Error('load'))};document.head.appendChild(el)})}
function netErr(e){

  if(c==='load')return 'Tidak bisa memuat Firebase. Buka file chat.html di browser Anda, bukan lewat halaman pratinjau.';

  if(/permission-denied/.test(c))return 'Aturan Firestore belum dipasang atau menolak akses.';
  if(c==='phone_taken')return 'ID ini sudah dipakai perangkat lain.';
  if(/api-key|invalid-api/.test(c))return 'API key tidak valid. Periksa konfigurasi.';
  if(/network|unavailable/.test(c))return 'Tidak ada koneksi ke server.';

function afterStage(){
  if(UI.stage==='signup'){
    var n=$('#name'),p=$('#phone'),b=$('#go');
    var upd=function(){b.disabled=!(n.value.trim()&&p.value.trim())};
    n.addEventListener('input',function(){upd();if(!UI.tmp.photo)paintPp()});p.addEventListener('input',upd);upd();paintPp();
  }
  if(UI.stage==='otp'){
    var o=$('#otp'),v=$('#vgo');
    o.addEventListener('input',function(){o.value=o.value.replace(/\D/g,'');v.disabled=o.value.length<6;if(o.value.length===6)verify()});
    o.focus();
  }
}
function normPhone(raw){return String(raw).replace(/\D/g,'')}
function doSignup(){
  var name=$('#name').value.trim(),raw=$('#phone').value.trim();
  UI.tmp.name=name;UI.tmp.phone=raw;
  if(!name){$('#err').textContent='Nama wajib diisi.';return}
  if(!raw){$('#err').textContent='ID chat wajib diisi.';return}
  var d=normPhone(raw);
  if(!/^\d{6,12}$/.test(d)){$('#err').textContent='Masukkan ID chat yang valid (6 digit angka).';return}
  UI.tmp.digits=d;
  var go=function(){UI.tmp.code=String(Math.floor(100000+Math.random()*900000));UI.stage='otp';renderScreen();showSms()};
  if(NET.state==='on'){
    NET.db.collection('users').doc(d).get().then(function(sn){
      if(sn.exists&&sn.data().uid!==NET.uid){$('#err').textContent='ID ini sudah dipakai perangkat lain.';return}
      go();
    }).catch(function(e){$('#err').textContent=netErr(e)});
    return;
  }
  go();
}
var smsT;
function showSms(){
  clearTimeout(smsT);
  smsT=setTimeout(function(){
    $('#sms').innerHTML='<div class="sms" role="alert"><span class="sic s">'+ic('chat')+'</span><div><b>Pesan demo untuk '+esc(fmtPhone(UI.tmp.digits))+'</b>'+esc(APP_NAME)+': kode verifikasi Anda '+esc(UI.tmp.code.slice(0,3)+' '+UI.tmp.code.slice(3))+'. Jangan bagikan kode ini.</div></div>';
    smsT=setTimeout(function(){$('#sms').innerHTML=''},14000);
  },1100);
}
function verify(){
  var o=$('#otp');if(!o)return;
  if(o.value===UI.tmp.code){$('#sms').innerHTML='';finish()}
  else{$('#err').textContent='Kode salah. Periksa pesan di layar dan coba lagi.'}
}
function finish(){
  S.user.name=UI.tmp.name||'Pengguna';S.user.phone=UI.tmp.digits;S.user.photo=UI.tmp.photo||'';S.user.via='phone';S.onboarded=true;
  var cs=chat('cs');if(cs&&cs.msgs.length&&cs.msgs[0].f==='them')cs.msgs[0].t=csHuman(S.user.name);
  var of=chat('off');if(of&&of.msgs.length&&of.msgs[0].f==='them')of.msgs[0].t=csGreet(S.user.name);
  save();UI.stage='main';UI.tab='chat';renderScreen();
  showOpening();
  askLocation();
  if(NET.state==='on')registerUser().then(netListen).catch(function(e){toast(netErr(e))});
}

function showOpening(){

  var v=$('#opv');v.muted=false;v.volume=1;
  v.addEventListener('ended',closeOpening);
  v.addEventListener('error',closeOpening);
  var p=v.play();
  if(p&&p.catch)p.catch(function(){
    v.muted=true;var q=v.play();if(q&&q.catch)q.catch(function(){});
    var un=function(){v.muted=false;document.removeEventListener('pointerdown',un,true);document.removeEventListener('keydown',un,true)};
    document.addEventListener('pointerdown',un,true);document.addEventListener('keydown',un,true);
  });
}

/* ---------- penyimpanan ---------- */
function stats(){
  var st={photo:0,doc:0,status:0,pc:0,dc:0,sc:0,per:{},msgs:0,old:0,text:0};
  Object.keys(S.media).forEach(function(id){
    var x=S.media[id];
    if(x.src==='status'){st.status+=x.size;st.sc++}
    else if(x.kind==='img'){st.photo+=x.size;st.pc++}
    else{st.doc+=x.size;st.dc++}
    if(x.src==='chat'){var p=st.per[x.chat]||(st.per[x.chat]={n:0,s:0});p.n++;p.s+=x.size}
  });
  var cut=Date.now()-30*864e5;
  S.chats.forEach(function(c){c.msgs.forEach(function(x){st.msgs++;if(x.ts<cut)st.old++})});
  try{st.text=JSON.stringify(S).length}catch(e){}
  return st;
}
function idsWhere(fn){return Object.keys(S.media).filter(function(id){return fn(S.media[id])})}
function cleanKind(k,arg){
  var ids=[];
  if(k==='photo')ids=idsWhere(function(x){return x.src==='chat'&&x.kind==='img'});
  else if(k==='doc')ids=idsWhere(function(x){return x.kind==='file'});
  else if(k==='status')ids=idsWhere(function(x){return x.src==='status'});
  else if(k==='chat')ids=idsWhere(function(x){return x.src==='chat'&&x.chat===arg});
  else if(k==='all')ids=Object.keys(S.media);
  else if(k==='old'){
    var cut=Date.now()-30*864e5;
    S.chats.forEach(function(c){if(c.remote)return;c.msgs=c.msgs.filter(function(x){if(x.ts<cut){if(x.media&&S.media[x.media.id])ids.push(x.media.id);return false}return true})});
  }
  var freed=0;ids.forEach(function(id){if(S.media[id])freed+=S.media[id].size});
  dropMedia(ids);
  return {freed:freed,n:ids.length};
}

   '<p class="hint" id="quota">'+(DB.persistent()?'Database lokal (IndexedDB) aktif.':'Database lokal tidak tersedia di browser ini. Media hanya tersimpan selama halaman terbuka.')+'</p></div>'+

  else if(k==='mute'){c.muted=!c.muted;save();toast(c.muted?'Notifikasi dibisukan':'Notifikasi diaktifkan')}

    save();

  }
  else if(k==='unread'){c.unread=c.unread?0:1;save();toast(c.unread?'Ditandai belum dibaca':'Ditandai sudah dibaca')}
  else if(k==='clear'){clearChat(c);toast('Obrolan dikosongkan')}

function fetchTermuxAPI(endpoint, data, cb){
  var urlInput = $('#termux-url');
  if(urlInput) WA_STATE.serverUrl = urlInput.value.trim();
  
  toast('Menghubungkan ke Termux...');
  fetch(WA_STATE.serverUrl + endpoint, {
    method: data ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: data ? JSON.stringify(data) : null
  })
  .then(function(res){ return res.json(); })
  .then(function(json){
    WA_STATE.connected = true;
    if(cb) cb(json);
    if(UI.stack.length && UI.stack[UI.stack.length-1].t==='devices') paintLayer();
  })
  .catch(function(err){
    WA_STATE.connected = false;
    toast('Gagal terhubung ke Termux server. Pastikan Node.js aktif.');
    if(UI.stack.length && UI.stack[UI.stack.length-1].t==='devices') paintLayer();
  });
}

  case 'reqpairingcode':{
    var phoneInput = $('#pairing-phone').value.trim();
    if(!phoneInput){ toast('Masukkan nomor HP terlebih dahulu'); break; }
    fetchTermuxAPI('/api/request-pairing', { phone: phoneInput }, function(data){
      if(data && data.pairingCode){
        WA_STATE.pairingCode = data.pairingCode;
        WA_STATE.qrCode = null;
        closeSheet();
        toast('Kode pairing diterima!');
      } else {
        toast('Gagal mendapatkan kode pairing dari Termux.');
      }
    });
    break;
  }
  case 'testtermux':{
    fetchTermuxAPI('/api/status', null, function(data){
      toast('Terhubung ke Termux! Status: ' + (data.status || 'OK'));
      WA_STATE.connected = true;
    });
    break;
  }
  case 'unlink':S.devices=S.devices.filter(function(x){return x.id!==d.id});save();paintLayer();toast('Perangkat dikeluarkan');break;
  case 'dologout':netStop();try{localStorage.removeItem(KEY)}catch(x){}DB.clear();URLS={};S=defaults();applyTheme();applyWall();closeSheet();UI.stack=[];paintLayer();UI.tmp={};if(AID){S.user.name=AN||'Pengguna';S.user.phone=AID;S.onboarded=true;save()}UI.stage=AID?'main':'signup';UI.tab='chat';renderScreen();break;
  case 'scrim':if(e.target===el)closeSheet();break;
  case 'closesheet':closeSheet();break;
  case 'signup':doSignup();break;
  case 'tosignup':UI.stage='signup';renderScreen();break;
  case 'verify':verify();break;
  case 'resend':UI.tmp.code=String(Math.floor(100000+Math.random()*900000));showSms();toast('Kode baru dikirim');break;
  }
}
document.addEventListener('click',function(e){
  if(e.target.closest&&e.target.closest('a[href]'))return;
  if(UI.lp){UI.lp=false;return}
  var b=e.target.closest('[data-act]');
  if(UI.menu&&!e.target.closest('.menu')&&!(b&&(b.dataset.act==='menu'||b.dataset.act==='tmenu')))paintMenu(false);
  if(b){act(b.dataset.act,b.dataset,e,b);return}
  var mg=e.target.closest('.msg[data-mi]');
  if(mg)openMsgMenu(mg.dataset.mi);
});
var lpT,lpX=0,lpY=0;
document.addEventListener('pointerdown',function(e){
  UI.lp=false;
  var mg=e.target.closest&&e.target.closest('.msg[data-mi]');
  var rw=!mg&&e.target.closest&&e.target.closest('.row.cr');
  if((!mg&&!rw)||e.target.closest('a[href]'))return;
  lpX=e.clientX;lpY=e.clientY;clearTimeout(lpT);
  lpT=setTimeout(function(){UI.lp=true;if(mg)openMsgMenu(mg.dataset.mi);else if(!UI.sheet)openSheet('rowmenu',{id:rw.dataset.id})},480);
});
['pointerup','pointercancel'].forEach(function(ev){document.addEventListener(ev,function(){clearTimeout(lpT)})});
document.addEventListener('pointermove',function(e){if(Math.abs(e.clientX-lpX)>8||Math.abs(e.clientY-lpY)>8)clearTimeout(lpT)});
document.addEventListener('contextmenu',function(e){
  var t=e.target.closest&&e.target.closest('.msg[data-mi]');if(t){e.preventDefault();return}
  var r=e.target.closest&&e.target.closest('.row.cr');if(r){e.preventDefault();if(!UI.sheet)openSheet('rowmenu',{id:r.dataset.id})}
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click();return}
  if(e.key==='Escape'){
    if($('#open').innerHTML)closeOpening();
    else if($('#view').innerHTML)$('#view').innerHTML='';
    else if(UI.sheet)closeSheet();else if(UI.menu)paintMenu(false);else if(UI.call)endCall();else if(UI.sv)svClose();else if(UI.stack.length)pop();
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){UI.q=e.target.value;paintList()}
  if(e.target.id==='tq'){UI.tq=e.target.value;var tp=UI.stack[UI.stack.length-1];if(tp&&tp.t==='thread')paintMsgs(chat(tp.id).msgs,false)}
});

/* ---------- mulai ---------- */
if(AID){S.user.name=AN||S.user.name||'Pengguna';S.user.phone=AID;S.onboarded=true}
applyTheme();
applyWall();
DB.open();
purgeStatuses();
save();
UI.stage='splash';renderScreen();
setInterval(function(){var e=$('#clk');if(e)e.textContent=clockText()},1000);
var cfg00=getCfg();if(cfg00)netConnect(cfg00);
setTimeout(function(){UI.stage=S.onboarded?'main':'signup';renderScreen();if(S.onboarded)askLocation()},1500);
})();
</script>

</body>
</html>

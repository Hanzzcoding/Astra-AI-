<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Astra - Sedang Pemeliharaan</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #060913;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(14, 165, 233, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(37, 99, 235, 0.1) 0%, transparent 40%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 45px 35px;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(14, 165, 233, 0.15);
            text-align: center;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(56, 189, 248, 0.2);
            position: relative;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Container Ilustrasi Teknologi */
        .illustration-box {
            position: relative;
            width: 190px;
            height: 150px;
            margin: 0 auto 15px auto;
        }

        .handyman-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
        }

        /* Animasi Roda Gigi (Gear) Berputar di Atas */
        .tech-gear-1 {
            transform-origin: 145px 45px;
            animation: rotateGearCw 8s linear infinite;
        }

        .tech-gear-2 {
            transform-origin: 55px 55px;
            animation: rotateGearCcw 6s linear infinite;
        }

        @keyframes rotateGearCw {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotateGearCcw {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* Efek Garis Hologram / Pulsa Teknologi */
        .pulse-ring {
            animation: pulseGlow 2.5s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.03); }
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status-text {
            font-size: 14px;
            color: #fbbf24;
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: 500;
            background: rgba(251, 191, 36, 0.08);
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid rgba(251, 191, 36, 0.25);
            box-shadow: inset 0 0 10px rgba(251, 191, 36, 0.05);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 24px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            cursor: pointer;
            border: none;
        }

        .btn-translate {
            background: rgba(30, 41, 59, 0.8);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-translate:hover {
            background: rgba(51, 65, 85, 1);
            border-color: #38bdf8;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.2);
        }

        .btn-join {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4);
        }

        .btn-join:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(14, 165, 233, 0.6);
        }

        .wa-svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ilustrasi Vektor Tech-Style (Tukang, Tas/Kotak Alat, dan Roda Gigi Berputar) -->
        <div class="illustration-box">
            <svg class="handyman-svg" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
                <!-- Lingkaran Hologram Tech di Background -->
                <circle cx="100" cy="85" r="70" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.5" stroke-dasharray="6 4" class="pulse-ring"/>
                
                <!-- Roda Gigi (Gear) Teknologi Berputar di Atas -->
                <g class="tech-gear-1">
                    <circle cx="145" cy="45" r="14" fill="#0ea5e9" opacity="0.3"/>
                    <path d="M 145 30 L 148 35 L 153 33 L 152 39 L 158 41 L 154 46 L 158 50 L 152 52 L 153 58 L 148 56 L 145 61 L 142 56 L 137 58 L 138 52 L 132 50 L 136 46 L 132 41 L 138 39 L 137 33 L 142 35 Z" fill="#38bdf8"/>
                    <circle cx="145" cy="45" r="5" fill="#0f172a"/>
                </g>

                <g class="tech-gear-2">
                    <circle cx="55" cy="55" r="10" fill="#2563eb" opacity="0.3"/>
                    <path d="M 55 43 L 57 47 L 61 45 L 60 50 L 65 52 L 61 56 L 65 60 L 60 62 L 61 67 L 57 65 L 55 69 L 53 65 L 49 67 L 50 62 L 45 60 L 49 56 L 45 52 L 50 50 L 49 45 L 53 47 Z" fill="#60a5fa"/>
                    <circle cx="55" cy="55" r="4" fill="#0f172a"/>
                </g>

                <!-- Badan & Pundak Pekerja (Tampak Belakang) -->
                <path d="M 60 140 C 60 105, 95 100, 115 100 C 135 100, 170 105, 170 140 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
                <!-- Rompi / Baju Pelindung Oranye Khas Tukang -->
                <path d="M 75 115 L 90 115 L 95 140 L 70 140 Z" fill="#f97316"/>
                <path d="M 125 115 L 140 115 L 145 140 L 120 140 Z" fill="#f97316"/>
                <!-- Leher & Kepala -->
                <rect x="95" y="80" width="20" height="25" fill="#e2b078" rx="6"/>
                <!-- Helm Proyek Oranye dengan Kilau Tech -->
                <path d="M 80 70 C 80 42, 140 42, 140 70 Z" fill="#f97316"/>
                <path d="M 74 66 C 74 60, 146 60, 146 66 L 150 72 L 70 72 Z" fill="#fb923c"/>
                <line x1="100" y1="50" x2="120" y2="50" stroke="#ffedd5" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

                <!-- Tas / Kotak Perkakas (Toolbox) di Samping (Tetap Ada) -->
                <g transform="translate(10, 15)">
                    <rect x="95" y="80" width="75" height="50" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
                    <path d="M 115 80 L 115 72 C 115 67, 155 67, 155 72 L 155 80" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
                    <rect x="123" y="98" width="20" height="10" rx="3" fill="#38bdf8"/>
                    <circle cx="133" cy="103" r="2.5" fill="#0f172a"/>
                </g>
            </svg>
        </div>

        <!-- Nama Brand -->
        <h1>AI ASTRA</h1>
        
        <!-- Teks Status Maintenance -->
        <div class="status-text" id="statusText">
            This website is currently under update or repair
        </div>

        <!-- Tombol Aksi -->
        <div class="btn-group">
            <button class="btn btn-translate" onclick="toggleTranslate()">
                🌐 <span id="translateBtnText">Terjemahkan ke Indonesia</span>
            </button>
            
            <a href="https://whatsapp.com/channel/0029Vb93mhbDOQIOVA69r03r" target="_blank" class="btn btn-join">
                <svg class="wa-svg" viewBox="0 0 24 24">
                    <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2m0 1.83c2.19 0 4.25.85 5.8 2.4 1.55 1.55 2.4 3.61 2.4 5.8 0 4.53-3.69 8.22-8.22 8.22-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.11.82.83-3.03-.2-.31a8.14 8.14 0 01-1.25-4.37c0-4.53 3.69-8.22 8.25-8.22M8.53 7.33c-.16 0-.35.06-.54.25-.19.19-.73.71-.73 1.73 0 1.02.75 2.01.85 2.15.1.14 1.48 2.29 3.63 3.21 2.15.92 2.15.61 2.54.57.39-.04 1.25-.51 1.43-1 .18-.49.18-.91.13-1-.05-.09-.19-.14-.4-.24-.21-.1-1.25-.62-1.44-.69-.19-.07-.33-.1-.47.1-.14.21-.54.69-.66.83-.12.14-.24.16-.45.06-.21-.1-1-.37-1.91-1.18-.71-.63-1.19-1.41-1.33-1.65-.14-.24-.01-.37.1-.48.1-.1.22-.24.33-.36.11-.12.15-.21.23-.35.08-.14.04-.27-.02-.38-.06-.11-.54-1.3-.74-1.78-.2-.48-.4-.41-.55-.42l-.47-.01z"/>
                </svg>
                Join Saluran untuk Update
            </a>
        </div>

        <div class="footer-note">
            &copy; 2026 AI Astra. All rights reserved.
        </div>
    </div>

    <!-- Script JavaScript untuk Tombol Terjemahan -->
    <script>
        let isIndonesian = false;
        function toggleTranslate() {
            const statusText = document.getElementById('statusText');
            const translateBtnText = document.getElementById('translateBtnText');
            
            isIndonesian = !isIndonesian;
            if (isIndonesian) {
                statusText.innerText = "Situs web ini sedang dalam pembaruan atau perbaikan";
                translateBtnText.innerText = "Translate to English";
            } else {
                statusText.innerText = "This website is currently under update or repair";
                translateBtnText.innerText = "Terjemahkan ke Indonesia";
            }
        }
    </script>

</body>
</html>

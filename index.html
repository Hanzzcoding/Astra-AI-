<!DOCTYPE html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030816"><title>ASTRA AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap">
<style>
/* Layout: layar penuh ala aplikasi chat. Splash -> login -> tawaran GO ASTRA -> chat. Dark-first, semua teks dan pesan biru; mode putih = latar putih, pesan putih. */
:root{
  --bg:#030816; --bg2:#071230; --card:#0a1838; --card2:#0e2048; --line:#1a3a78;
  --blue:#4da3ff; --text:#6db6ff; --muted:#4f86cc; --accent:#1f6fff; --accent2:#00c2ff;
  --ubub:linear-gradient(135deg,#1c6bff,#0b45c8); --utext:#eaf4ff; --abub:#0a1838;
  --glow:rgba(31,111,255,.35); --ok:#35d49a; --warn:#ffb340; --bad:#ff6b7d; --shadow:0 12px 40px rgba(0,0,0,.5);
  --f-d:'Sora',system-ui,sans-serif; --f-b:'Plus Jakarta Sans',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#ffffff; --bg2:#f4f8ff; --card:#ffffff; --card2:#eef4ff; --line:#c9dcff;
  --blue:#1558d6; --text:#1558d6; --muted:#4a74c4; --accent:#1558d6; --accent2:#0a8cff;
  --ubub:#ffffff; --utext:#1558d6; --abub:#ffffff; --glow:rgba(21,88,214,.18); --shadow:0 10px 30px rgba(21,88,214,.15); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#ffffff; --bg2:#f4f8ff; --card:#ffffff; --card2:#eef4ff; --line:#c9dcff;
  --blue:#1558d6; --text:#1558d6; --muted:#4a74c4; --accent:#1558d6; --accent2:#0a8cff;
  --ubub:#ffffff; --utext:#1558d6; --abub:#ffffff; --glow:rgba(21,88,214,.18); --shadow:0 10px 30px rgba(21,88,214,.15); color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-b);font-size:15px;line-height:1.55;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor;stroke:none}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.logo-img{display:block;object-fit:contain}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 40%,#0a1f55 0%,#030816 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .7s,visibility .7s;color:#6db6ff}
:root[data-theme="light"] #splash{background:radial-gradient(ellipse at 50% 40%,#e6f0ff 0%,#fff 65%);color:#1558d6}
#splash.out{opacity:0;visibility:hidden}
#stars{position:absolute;inset:0;width:100%;height:100%}
.orb{position:relative;width:170px;height:170px;display:grid;place-items:center;z-index:1}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:#4da3ff;border-right-color:#00c2ff;animation:spin 1.6s linear infinite;filter:drop-shadow(0 0 8px #1f6fff)}
.orb .ring.r2{inset:14px;animation-duration:2.4s;animation-direction:reverse;border-top-color:#1f6fff;border-right-color:transparent;border-left-color:#00c2ff}
.orb .ring.r3{inset:-14px;opacity:.5;animation-duration:4s}
.orb .dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#00c2ff;box-shadow:0 0 14px #00c2ff;top:50%;left:50%;margin:-5px;animation:orbit 3s linear infinite}
.orb .dot.d2{animation-delay:-1.5s;background:#4da3ff}
.orb .core{width:104px;height:104px;border-radius:28px;display:grid;place-items:center;background:rgba(14,32,72,.7);box-shadow:0 0 50px var(--glow),inset 0 0 20px rgba(77,163,255,.25);animation:pop 1s cubic-bezier(.2,1.4,.4,1) both,float 3s 1s ease-in-out infinite;overflow:hidden}
.orb .core img,.orb .core svg{width:84px;height:84px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes orbit{from{transform:rotate(0) translateX(96px)}to{transform:rotate(360deg) translateX(96px)}}
@keyframes pop{from{transform:scale(.2) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
@keyframes float{50%{transform:translateY(-6px)}}
.sname{font-family:var(--f-d);font-weight:800;font-size:clamp(32px,9vw,46px);letter-spacing:.18em;display:flex;gap:.02em;z-index:1}
.sname span{opacity:0;transform:translateY(16px);animation:rise .6s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.stag{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);z-index:1;opacity:0;animation:rise .8s 1.6s forwards}
.sbar{width:min(220px,60vw);height:4px;border-radius:4px;background:rgba(77,163,255,.18);overflow:hidden;z-index:1}
.sbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1f6fff,#00c2ff);border-radius:4px;animation:load 3.4s cubic-bezier(.5,0,.3,1) forwards}
@keyframes load{to{width:100%}}
.sfrom{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));font-size:12px;letter-spacing:.12em;color:var(--muted);z-index:1;text-align:center}
.sfrom b{color:var(--text);font-weight:700}

/* AUTH */
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
.authbox{width:min(400px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
.authbox .mark{margin:0 auto;width:76px;height:76px;border-radius:22px;background:var(--card2);display:grid;place-items:center;box-shadow:0 0 40px var(--glow);overflow:hidden}
.authbox .mark img,.authbox .mark svg{width:62px;height:62px}
.authbox h1{font-family:var(--f-d);font-size:26px;margin:4px 0 0;letter-spacing:.06em}
.authbox p{margin:0;color:var(--muted);font-size:13.5px}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:50px;transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:var(--accent2);box-shadow:0 0 0 3px var(--glow)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%}
.pwt{flex:none;display:grid;place-items:center;width:32px;height:32px;margin-right:-6px;border-radius:50%;background:none;color:var(--muted)}.pwt:active{color:var(--text)}
.field input::placeholder{color:var(--muted);opacity:.7}
.btn{height:48px;border-radius:14px;padding:0 20px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .2s}
a.btn{text-decoration:none;color:var(--text)}
a.btn.pri{color:#fff}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 24px var(--glow)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sec{border:1px solid var(--line);background:var(--card)}
.btn.sec:hover{border-color:var(--accent2)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.foot{font-size:12px;color:var(--muted);margin-top:8px}

/* APP */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header.top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text);transition:background .2s}
.ibtn:hover{background:var(--card2)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-d);font-weight:800;letter-spacing:.12em;font-size:16px}
.brand .lg{width:28px;height:28px;border-radius:8px;overflow:hidden;display:grid;place-items:center}
.brand .lg img,.brand .lg svg{width:28px;height:28px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600}
.pill.up{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0}
#chat{flex:1;overflow-y:auto;padding:18px 14px 8px;scroll-behavior:smooth}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:5vh 0 6px}
.hero .mark{width:84px;height:84px;border-radius:24px;background:var(--card2);display:grid;place-items:center;box-shadow:0 0 50px var(--glow);overflow:hidden;animation:float 3.5s ease-in-out infinite}
.hero .mark img,.hero .mark svg{width:68px;height:68px}
.hero h2{font-family:var(--f-d);font-size:clamp(22px,5.5vw,30px);margin:6px 0 0}
.hero p{margin:0;color:var(--muted);max-width:420px}
.sugs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px;width:100%}
.sug{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);transition:transform .15s,border-color .2s}
.sug:hover{border-color:var(--accent2);transform:translateY(-2px)}
.sug .ic{width:34px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:var(--accent2);flex:none}
.sug b{display:block;font-size:13.5px}
.sug small{color:var(--muted);font-size:12.5px}
.msg{display:flex;gap:10px;max-width:100%;animation:rise .35s both}
.msg.user{justify-content:flex-end}
.av{width:32px;height:32px;border-radius:10px;background:var(--card2);overflow:hidden;display:grid;place-items:center;flex:none}
.av img,.av svg{width:26px;height:26px}
.bub{min-width:0;max-width:min(88%,640px);padding:11px 15px;border-radius:18px;border:1px solid var(--line);overflow-wrap:anywhere}
.msg.ai .bub{background:var(--abub);border-top-left-radius:6px}
.msg.user .bub{background:var(--ubub);color:var(--utext);border-color:var(--accent);border-top-right-radius:6px;box-shadow:0 6px 20px var(--glow)}
.bub p{margin:0}
.bub ul{margin:6px 0;padding-left:20px}
.bub code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--card2);padding:1px 6px;border-radius:6px}
.codeblk{margin:8px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg2)}
.codeblk .hd{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.codeblk pre{margin:0;padding:12px;overflow-x:auto;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.5}
.cp{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);padding:3px 8px;border-radius:8px}
.cp:hover{background:var(--card2);color:var(--text)}
.cp svg{width:14px;height:14px}
.acts{display:flex;gap:4px;margin-top:6px}
details.think{margin-bottom:8px;border:1px dashed var(--line);border-radius:12px;padding:7px 11px;font-size:13px;color:var(--muted)}
details.think summary{cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none}
details.think summary::-webkit-details-marker{display:none}
.think ol{margin:8px 0 2px;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.think li.on::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent2);margin-left:8px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.spin{animation:spin 1.2s linear infinite}
.dots{display:inline-flex;gap:4px;align-items:center;height:20px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent2);animation:bounce 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{40%{transform:translateY(-6px)}}
.att{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.achip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;max-width:230px;color:var(--text)}
.achip .th{width:34px;height:34px;border-radius:8px;background:var(--card);display:grid;place-items:center;overflow:hidden;flex:none}
.achip .th img{width:100%;height:100%;object-fit:cover}
.achip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.achip button{display:grid;place-items:center;color:var(--muted)}
.imgcard{display:flex;flex-direction:column;gap:10px;min-width:min(260px,70vw)}
.pbar{height:8px;border-radius:8px;background:var(--card2);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:8px;transition:width .3s}
.imgcard .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.imgcard .pc{font-family:var(--f-d);font-weight:800;font-size:26px;color:var(--text)}


/* ROLE BADGE */
.role{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.4px;line-height:1.6;color:#fff;white-space:nowrap;font-style:normal;position:relative;overflow:hidden;vertical-align:middle}
.role svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.role.r-free{background:linear-gradient(135deg,#6b7a99,#8fa3c7)}
.role.r-lite{background:linear-gradient(135deg,#0f9d58,#34d27b)}
.role.r-plus{background:linear-gradient(135deg,#1558d6,#2fa8ff)}
.role.r-pro{background:linear-gradient(135deg,#6a2bd9,#b66cff)}
.role.r-legend{background:linear-gradient(135deg,#ff8a00,#ff3d1f);box-shadow:0 0 10px rgba(255,100,20,.45)}
.role.r-mythic{background:linear-gradient(90deg,#ff0040,#ff9a00,#ffe600,#2bd94a,#00c8ff,#6a4dff,#d633ff,#ff0040);background-size:300% 100%;animation:roleRb 3s linear infinite;text-shadow:0 1px 2px rgba(0,0,0,.55);box-shadow:0 0 12px rgba(160,90,255,.5)}
.role.r-owner{background:linear-gradient(110deg,#a8740a,#ffd54a 30%,#fff3b0 50%,#ffd54a 70%,#a8740a);background-size:200% 100%;animation:roleGold 2.4s linear infinite;color:#4a2f00;text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:0 0 12px rgba(255,200,60,.55)}
@keyframes roleRb{to{background-position:300% 0}}
@keyframes roleGold{to{background-position:-200% 0}}
.ucol{display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:0;max-width:min(88%,640px)}
.ucol .bub{max-width:100%}
.ucol .role{margin-right:4px}
.curplan .role{margin-left:6px}


.pill.rolepill{background:transparent;border:0;padding:2px}
.pill.rolepill .role{font-size:12.5px;padding:5px 13px}
.hero h2.hand{font-family:'Dancing Script','Segoe Script','Brush Script MT',cursive;font-weight:700;font-size:clamp(32px,9vw,46px);line-height:1.15;letter-spacing:.5px;text-shadow:0 0 22px var(--glow)}
.hand .w{display:inline-block;white-space:nowrap}
.hand .c{display:inline-block;clip-path:inset(-20% 100% -20% -2%);animation:hwrite .34s ease-out forwards;animation-delay:calc(var(--i)*85ms + .5s)}
@keyframes hwrite{to{clip-path:inset(-20% -10% -20% -2%)}}
.hero.wl p{opacity:0;animation:hfade .9s ease forwards;animation-delay:var(--pd,3s)}
.hero.wl .sugs{opacity:0;animation:hfade .9s ease forwards;animation-delay:calc(var(--pd,3s) + .5s)}
@keyframes hfade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.hand .c{animation-duration:.01s;animation-delay:0s}}

#acbg{position:fixed;inset:0;background:center/cover;opacity:0;pointer-events:none;transition:opacity .8s}#acbg.on{opacity:.4}body:has(#acbg.on) #app{background:transparent}
.omod{animation:pop .42s cubic-bezier(.2,.9,.3,1.25) both}@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.94)}}
.omod label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}.oin{padding:11px 13px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:inherit;font:inherit;width:100%;transition:border-color .2s,box-shadow .2s}.oin:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.omod .btn{transition:transform .15s,filter .2s}.omod .btn:active{transform:scale(.96)}.dng{color:#ff6b6b}.mt{color:var(--muted);text-align:center}
.comm{height:88vh;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 62%,transparent)}.rm{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;padding:4px}
.rmsg .rc{-webkit-touch-callout:none;cursor:pointer}.rmsg{display:flex;gap:9px;animation:rmin .38s cubic-bezier(.2,.9,.3,1.15) both}.rmsg.me{flex-direction:row-reverse}@keyframes rmin{from{opacity:0;transform:translateY(12px) scale(.96)}}
.oav{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--card2);display:grid;place-items:center;font-weight:800;flex:none}.rb{max-width:76%;display:flex;flex-direction:column;gap:3px}.me .rb{align-items:flex-end}
.rn{font-size:11.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.rst{color:var(--muted);font-size:11px}.rc{padding:9px 13px;border-radius:16px;background:var(--card2);overflow-wrap:anywhere}.me .rc{background:var(--ubub);color:var(--utext)}.rc.stk{background:none;padding:0}.rc.stk img{width:132px;height:132px;object-fit:cover;border-radius:16px}
.rbar{display:flex;gap:8px;align-items:center}.stp{display:flex;flex-wrap:wrap;gap:6px;max-height:130px;overflow:auto;animation:pop .3s both}.stp button{font-size:26px;background:var(--card);border:1px solid var(--line);border-radius:12px;width:52px;height:52px;transition:transform .15s}.stp button:active{transform:scale(.88)}.stp img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.scv{width:200px;height:200px;align-self:center;border-radius:18px;background:var(--card)}.idc,.acp{display:flex;align-items:center;gap:10px}.acp{gap:12px}.acp .oav{width:54px;height:54px}.frw{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;cursor:pointer;transition:background .2s,transform .2s}.frw:hover{background:var(--card2);transform:translateX(3px)}.frw small,.acp small{display:block;color:var(--muted)}
.cbox{transition:box-shadow .5s,background .5s}.cbox.fx-glow{animation:fxg 2.6s ease-in-out infinite}.cbox.fx-neon{box-shadow:0 0 0 1.5px #0ff,0 0 18px #0ff,0 0 34px #f0f8}.cbox.fx-aurora{animation:fxa 6s linear infinite}
@keyframes fxg{50%{box-shadow:0 0 26px var(--accent)}}@keyframes fxa{0%,100%{box-shadow:0 0 22px #3bf}33%{box-shadow:0 0 26px #b5f}66%{box-shadow:0 0 24px #3fa}}

.rc.bot{background:rgba(255,200,60,.13);border:1px solid rgba(255,200,60,.4);white-space:pre-wrap;font-size:13px}.lv{color:#3ddc84;font-size:11px;font-style:normal;margin-left:8px;animation:fxg 2s ease-in-out infinite}
.rmsg.pend{opacity:.55}.rmsg.bad .rc{background:rgba(255,70,70,.22);border:1px solid #ff5a5a}.rfail{color:#ff6b6b;font-size:11.5px;cursor:pointer;animation:shk .4s}@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#ov:has(.full){padding:0}.modal.full{width:100%;max-width:none;height:100dvh;max-height:none;border-radius:0;padding:12px;gap:8px}
.rh{display:flex;align-items:center;gap:10px}.rh h3{margin:0;flex:1}.stb{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mimg{max-width:min(240px,100%);border-radius:14px;cursor:zoom-in;display:block}.mimg.stk{width:132px;height:132px;object-fit:cover}.mvid{max-width:min(260px,100%);border-radius:14px}.mfile{display:block;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.12);color:inherit;text-decoration:none;overflow-wrap:anywhere}
.rc.big{font-size:44px;background:none!important;padding:0;border:0}.rc.img,.rc.vid,.rc.file,.rc.stk{background:none!important;padding:0;border:0}
.fsv{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:14px;animation:rise .2s both}.fsv.dark{background:#000;padding:0}.fsv.dark img,.fsv.dark video{max-width:100%;max-height:100%}
.fsb{background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;width:min(420px,100%);max-height:90vh;overflow:auto}

function calcParse(str){
  let i=0;const s=str.replace(/\s+/g,'');
  function num(){const m=/^\d+(\.\d+)?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])}
  function pri(){if(s[i]==='('){i++;const v=ex();if(s[i]!==')')throw 0;i++;return pc(v)}if(s[i]==='-'){i++;return -pri()}if(s[i]==='+'){i++;return pri()}return pc(num())}

  function pw(){let b=pri();if(s[i]==='^'){i++;return Math.pow(b,pw())}return b}
  function tm(){let v=pw();while(s[i]==='*'||s[i]==='/'){const o=s[i++];const r=pw();v=o==='*'?v*r:v/r}return v}
  function ex(){let v=tm();while(s[i]==='+'||s[i]==='-'){const o=s[i++];const r=tm();v=o==='+'?v+r:v-r}return v}
  const v=ex();if(i!==s.length)throw 0;return v;
}

/* ---------- parser link ---------- */
function parseLink(raw){let u=String(raw||'').trim();if(!u)throw new Error('Tempel link dulu');if(!/^https?:\/\//i.test(u))u='https://'+u;u=u.replace(/^http:\/\//i,'https://');let m;
 if((m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/i)))return{k:'emb',src:'https://www.youtube.com/embed/'+m[1]+'?autoplay=1&playsinline=1&rel=0&modestbranding=1',name:'YouTube'};
 if((m=u.match(/tiktok\.com\/.*?video\/(\d+)/i)))return{k:'emb',src:'https://www.tiktok.com/embed/v2/'+m[1],name:'TikTok'};
 if(/tiktok\.com/i.test(u))throw new Error('Link TikTok pendek tidak bisa dibaca. Buka videonya lalu salin link lengkapnya (…/video/angka).');
 if((m=u.match(/instagram\.com\/(p|reel|reels|tv)\/([\w-]+)/i)))return{k:'emb',src:'https://www.instagram.com/'+(m[1]==='reels'?'reel':m[1])+'/'+m[2]+'/embed',name:'Instagram'};
 if((m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/i)))return{k:'emb',src:'https://player.vimeo.com/video/'+m[1]+'?autoplay=1',name:'Vimeo'};
 if(/\.(mp4|webm|ogv|mov|m4v)(\?|#|$)/i.test(u))return{k:'vid',src:u,name:'Video'};
 if(/\.(png|jpe?g|gif|webp|avif|bmp)(\?|#|$)/i.test(u))return{k:'img',src:u,name:'Gambar'};
 throw new Error('Link belum dikenali. Pakai link YouTube / TikTok / Instagram / Vimeo, atau link langsung .mp4 / .jpg / .png');}
function fileToAd(f){return new Promise((res,rej)=>{
 if(f.type.startsWith('video/')){if(f.size>1.5e6)return rej(new Error('Video maksimal 1,5 MB. Untuk video besar, pakai link (YouTube/TikTok/IG/.mp4).'));const r=new FileReader();r.onload=()=>String(r.result).length>2.4e6?rej(new Error('Video terlalu besar')):res({k:'vid',src:String(r.result),name:f.name});r.onerror=()=>rej(new Error('Gagal membaca file'));r.readAsDataURL(f);return}
 if(!f.type.startsWith('image/'))return rej(new Error('Pilih file gambar atau video'));
 const r=new FileReader();r.onerror=()=>rej(new Error('Gagal membaca file'));r.onload=()=>{if(f.type==='image/gif'){if(f.size>1.2e6)return rej(new Error('GIF maksimal 1,2 MB'));return res({k:'img',src:String(r.result),name:f.name})}
  const im=new Image();im.onerror=()=>rej(new Error('Gambar rusak'));im.onload=()=>{let w=Math.min(1280,im.width),qa=.82,out='';const c=document.createElement('canvas');for(let i=0;i<5;i++){c.width=w;c.height=Math.round(im.height*w/im.width);c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',qa);if(out.length<1.6e6)break;w=Math.round(w*.75);qa=Math.max(.5,qa-.1)}res(out.length<2.4e6?{k:'img',src:out,name:f.name}:null)};im.src=String(r.result)};r.readAsDataURL(f)})}

/* ---------- elemen iklan ---------- */
function adNode(a,host){const d=document.createElement('div');d.className='lvad';let m;
 if(a.k==='img'){m=new Image();m.src=a.src;m.alt=''}
 else if(a.k==='vid'){m=document.createElement('video');m.playsInline=true;m.autoplay=true;m.muted=!!host;m.src=a.src;const p=m.play();if(p&&p.catch)p.catch(()=>{m.muted=true;m.play().catch(()=>{})})}
 else{m=document.createElement('iframe');m.src=a.src;m.allow='autoplay; encrypted-media; fullscreen; picture-in-picture';m.referrerPolicy='no-referrer-when-downgrade';m.setAttribute('allowfullscreen','');m.setAttribute('sandbox','allow-scripts allow-same-origin allow-presentation allow-popups')}
 m.className='admed';d.appendChild(m);
 if(a.lab){const l=document.createElement('span');l.className='adlab';l.textContent='IKLAN';d.appendChild(l)}
 if(a.title){const t=document.createElement('div');t.className='adtt';t.textContent=a.title;d.appendChild(t)}
 return{el:d,media:m}}

function txtLayer(W,edit,onChange){const L=document.createElement('div');L.className='lvtl'+(edit?' edit':'');W.appendChild(L);let list=[],tm=0;
 const push=fin=>{if(!onChange)return;if(fin){clearTimeout(tm);onChange(list);return}if(tm)return;tm=setTimeout(()=>{tm=0;onChange(list)},120)};
 const draw=()=>{L.innerHTML='';const sc=Math.max(.6,W.clientWidth/360);list.forEach(x=>{const e=document.createElement('div');e.className='lvtx'+(x.bg?' bg':'');e.textContent=x.s;e.style.cssText=`left:${x.x*100}%;top:${x.y*100}%;color:${x.c};font-size:${x.z*sc}px;font-weight:${x.b?800:600}`;
  if(edit){let d=null;e.addEventListener('pointerdown',ev=>{const r=L.getBoundingClientRect();d={r};e.setPointerCapture(ev.pointerId);ev.preventDefault()});
   e.addEventListener('pointermove',ev=>{if(!d)return;x.x=Math.max(.03,Math.min(.97,(ev.clientX-d.r.left)/d.r.width));x.y=Math.max(.03,Math.min(.97,(ev.clientY-d.r.top)/d.r.height));e.style.left=x.x*100+'%';e.style.top=x.y*100+'%';push(false)});
   const up=()=>{if(d){d=null;push(true)}};e.addEventListener('pointerup',up);e.addEventListener('pointercancel',up)}
  L.appendChild(e)})};
 return{el:L,set(l){list=(l||[]).map(x=>({...x}));draw()},get:()=>list,add(o){if(list.length>=8)throw new Error('Maksimal 8 teks');list.push(o);draw();push(true)},del(id){list=list.filter(x=>x.id!==id);draw();push(true)},redraw:draw}}

function goalBar(W){const g=document.createElement('div');g.className='lvgoal';W.appendChild(g);let cur=null;
 const upd=gifts=>{if(!cur){g.style.display='none';return}const got=Math.max(0,gifts-cur.base),p=Math.min(1,got/cur.target);g.style.display='block';g.innerHTML=`<div style="display:flex;justify-content:space-between"><span>${esc(cur.title)}</span><span>${rp(got)} / ${rp(cur.target)}</span></div><div class="gb"><i style="width:${p*100}%"></i></div>`};
 return{set(goal,gifts){cur=goal;upd(gifts||0)},upd}}
function pinBar(W){const p=document.createElement('div');p.className='lvpin';W.appendChild(p);return{set(c){if(!c){p.style.display='none';return}p.style.display='block';p.innerHTML=`${ic('pin','sm')} <b>${esc(c.u.name)}</b> ${esc(c.b)}`}}}
function hearts(W,n){n=Math.min(n||1,8);for(let i=0;i<n;i++)setTimeout(()=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('class','lvhrt');s.innerHTML=SV.heart;s.style.setProperty('--dx',(Math.random()*80-50)+'px');s.style.animationDuration=1.8+Math.random()*.9+'s';W.appendChild(s);setTimeout(()=>s.remove(),2800)},i*110)}
function theme(el,fx){fx=fx||{};[...el.classList].forEach(c=>{if(/^(th|an)-/.test(c))el.classList.remove(c)});el.classList.add('th-'+(fx.theme||'neon'),'an-'+(fx.anim||'slide'))}
